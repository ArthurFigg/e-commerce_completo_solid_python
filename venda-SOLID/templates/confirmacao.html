    <style>
      :root {

        --cor-fundo-componente: #172b46;
        --cor-azul-destaque: #0099ff;
        --cor-texto-claro: #f8f9fa;
      }
      body { display:flex; flex-direction:column; min-height:100vh; background:var(--cor-fundo-escuro); color:var(--cor-texto-claro); font-family:'Poppins',sans-serif; }
      main { flex-grow:1; }
      .wave-trim { line-height:0; height:80px; overflow:hidden; }
      .wave-trim svg { height:100%; width:100%; }

      .table { --bs-table-bg:var(--cor-fundo-componente); --bs-table-border-color:#2a3f5e; --bs-table-color:var(--cor-texto-claro); }
      .card.totais { background-color:var(--cor-fundo-componente); border-color:#2a3f5e; }
      .btn-qty { width:40px; }
      .input-qty { max-width:90px; }
    </style>
